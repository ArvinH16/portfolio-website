<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!-- Decorative Persian glyph strips: "مهندس و بنیان‌گذار" (Engineer & Founder).
       Text inherits fill from the referencing .svg element (var(--textTitle)). -->
  <defs>
    <symbol id="katakana-project" viewBox="0 0 751 136">
      <text
        x="0"
        y="110"
        font-family="Vazirmatn, 'Geeza Pro', Tahoma, 'Segoe UI', 'Noto Sans Arabic', sans-serif"
        font-weight="700"
        font-size="126"
        textLength="751"
        lengthAdjust="spacingAndGlyphs"
      >مهندس و بنیان‌گذار</text>
    </symbol>
    <symbol id="katakana-profile" viewBox="0 0 136 766">
      <text
        x="0"
        y="0"
        transform="translate(34,0) rotate(90)"
        font-family="Vazirmatn, 'Geeza Pro', Tahoma, 'Segoe UI', 'Noto Sans Arabic', sans-serif"
        font-weight="700"
        font-size="118"
        textLength="766"
        lengthAdjust="spacingAndGlyphs"
      >مهندس و بنیان‌گذار</text>
    </symbol>
  </defs>
</svg>
